name: Deploy to GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時に走らせない。ただし進行中のデプロイは中断せず完走させる。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # デフォルトブランチへのプッシュのときだけ公開する。
    # ブランチ名をベタ書きしないので、デフォルトブランチを main に変えても動く。
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.5
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test

      # GitHub Pages はリポジトリ名のサブパスで配信されるので base-href が必須。
      # --no-web-resources-cdn で CanvasKit を同梱し、gstatic への依存を外す。
      - name: Build web
        run: |
          flutter build web --release \
            --base-href "/${GITHUB_REPOSITORY#*/}/" \
            --no-web-resources-cdn

      # SPA なので、直リンクや再読み込みで 404 にならないよう index.html を複製する。
      - name: Add SPA fallback
        run: cp build/web/index.html build/web/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
